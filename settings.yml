community_links:
  type: objects
  schema:
    name: link
    identifier: text
    properties:
      text:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 1000
      url:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 2048
      target:
        type: enum
        default: _self
        choices:
        - _blank
        - _self
        - _parent
        - _top
      title:
        type: string
        validations:
          min_length: 1
          max_length: 1000
      referrer_policy:
        type: enum
        default: no-referrer-when-downgrade
        choices:
        - no-referrer
        - no-referrer-when-downgrade
        - origin
        - origin-when-cross-origin
        - unsafe-url
      translations:
        type: objects
        schema:
          name: translation
          identifier: locale
          properties:
            locale:
              type: enum
              required: true
              choices:
              - ar
              - be
              - bg
              - bs_BA
              - ca
              - cs
              - da
              - de
              - el
              - en
              - en_GB
              - es
              - et
              - fa_IR
              - fi
              - fr
              - gl
              - he
              - hr
              - hu
              - hy
              - id
              - it
              - ja
              - ko
              - lt
              - lv
              - nb_NO
              - nl
              - pl_PL
              - pt
              - pt_BR
              - ro
              - ru
              - sk
              - sl
              - sq
              - sr
              - sv
              - sw
              - te
              - th
              - tr_TR
              - ug
              - uk
              - ur
              - vi
              - zh_CN
              - zh_TW
            text:
              type: string
            title:
              type: string
  default:
  - text: Browse discussions
    url: /latest
    target: _self
  - text: Start a discussion
    url: /new-topic
    target: _self
