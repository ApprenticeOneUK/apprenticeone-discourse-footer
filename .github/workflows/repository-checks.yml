name: Repository checks

on:
  push:
    branches: [main, footer-three-columns]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python3 scripts/validate_component.py
      - run: npx --yes pnpm@10.28.0 install --frozen-lockfile
      - run: npx --yes pnpm@10.28.0 exec eslint javascripts --no-error-on-unmatched-pattern
      - run: npx --yes pnpm@10.28.0 exec ember-template-lint 'javascripts/**/*.gjs' --no-error-on-unmatched-pattern
      - run: npx --yes pnpm@10.28.0 exec prettier 'javascripts/**/*.gjs' --check
      - run: npx --yes pnpm@10.28.0 exec ember-tsc -b
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/package_component.py
